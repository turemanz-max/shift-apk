name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      
      - name: Build Debug APK
        run: |
          python3 -c "import os,shutil; [shutil.copytree(os.path.join(r,n),os.path.join(r,n.strip()),dirs_exist_ok=True) or shutil.rmtree(os.path.join(r,n)) if os.path.isdir(os.path.join(r,n)) else shutil.move(os.path.join(r,n),os.path.join(r,n.strip())) for r,ds,fs in os.walk('.',topdown=False) for n in fs+ds if n!=n.strip() and '.git' not in r]"
          cat settings.gradle.kts
          gradle :app:tasks




      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shift-schedule-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
